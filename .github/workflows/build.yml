name: NovaOS Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm gcc-multilib binutils lld
      - name: Build
        run: make
      - name: Check kernel size
        run: test -s novaos.bin && stat -c '%n %s bytes' novaos.bin
